name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Generate release notes
        id: notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${VERSION}$" | head -1)

          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi

          breaking=""
          features=""
          fixes=""
          other=""

          while IFS= read -r line; do
            msg="${line#* }"
            case "$msg" in
              feat!:*|feat\!:*)
                breaking+=$'\n'"- ${msg#*: }"
                ;;
              feat:*)
                features+=$'\n'"- ${msg#*: }"
                ;;
              fix:*)
                fixes+=$'\n'"- ${msg#*: }"
                ;;
              *)
                other+=$'\n'"- ${msg#*: }"
                ;;
            esac
          done < <(git log --oneline "$RANGE")

          notes="## What's Changed"
          if [ -n "$breaking" ]; then
            notes+=$'\n\n'"### Breaking changes${breaking}"
          fi
          if [ -n "$features" ]; then
            notes+=$'\n\n'"### New features${features}"
          fi
          if [ -n "$fixes" ]; then
            notes+=$'\n\n'"### Fixes${fixes}"
          fi
          if [ -n "$other" ]; then
            notes+=$'\n\n'"### Other${other}"
          fi
          notes+=$'\n\n'"**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${VERSION}"

          {
            echo "NOTES<<NOTES_EOF"
            echo "$notes"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build binaries
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          LDFLAGS="-s -w"
          targets=(
            "darwin/amd64"
            "darwin/arm64"
            "linux/amd64"
            "linux/arm64"
            "windows/amd64"
            "windows/arm64"
          )
          mkdir -p dist
          for target in "${targets[@]}"; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            output="hubcap-${VERSION}-${GOOS}-${GOARCH}"
            if [ "$GOOS" = "windows" ]; then
              GOOS=$GOOS GOARCH=$GOARCH go build -ldflags "$LDFLAGS" -o "dist/${output}/hubcap.exe" ./cmd/hubcap
            else
              GOOS=$GOOS GOARCH=$GOARCH go build -ldflags "$LDFLAGS" -o "dist/${output}/hubcap" ./cmd/hubcap
            fi
          done

      - name: Create archives
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          cd dist
          for dir in hubcap-*; do
            if [[ "$dir" == *windows* ]]; then
              zip "${dir}.zip" -r "$dir"
            else
              tar czf "${dir}.tar.gz" "$dir"
            fi
          done
          sha256sum *.tar.gz *.zip > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.NOTES }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
