name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -timeout 300s

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Generate release notes
        id: notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${VERSION}$" | head -1)

          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi

          breaking=""
          features=""
          fixes=""
          other=""

          while IFS= read -r line; do
            msg="${line#* }"
            case "$msg" in
              feat!:*|feat\!:*)
                breaking+=$'\n'"- ${msg#*: }"
                ;;
              feat:*)
                features+=$'\n'"- ${msg#*: }"
                ;;
              fix:*)
                fixes+=$'\n'"- ${msg#*: }"
                ;;
              *)
                other+=$'\n'"- ${msg#*: }"
                ;;
            esac
          done < <(git log --oneline "$RANGE")

          notes="## What's Changed"
          if [ -n "$breaking" ]; then
            notes+=$'\n\n'"### Breaking changes${breaking}"
          fi
          if [ -n "$features" ]; then
            notes+=$'\n\n'"### New features${features}"
          fi
          if [ -n "$fixes" ]; then
            notes+=$'\n\n'"### Fixes${fixes}"
          fi
          if [ -n "$other" ]; then
            notes+=$'\n\n'"### Other${other}"
          fi
          notes+=$'\n\n'"**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${VERSION}"

          {
            echo "NOTES<<NOTES_EOF"
            echo "$notes"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build binaries
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          LDFLAGS="-s -w"
          targets=(
            "darwin/amd64"
            "darwin/arm64"
            "linux/amd64"
            "linux/arm64"
            "windows/amd64"
            "windows/arm64"
          )
          mkdir -p dist
          for target in "${targets[@]}"; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            output="hubcap-${VERSION}-${GOOS}-${GOARCH}"
            if [ "$GOOS" = "windows" ]; then
              GOOS=$GOOS GOARCH=$GOARCH go build -ldflags "$LDFLAGS" -o "dist/${output}/hubcap.exe" ./cmd/hubcap
            else
              GOOS=$GOOS GOARCH=$GOARCH go build -ldflags "$LDFLAGS" -o "dist/${output}/hubcap" ./cmd/hubcap
            fi
          done

      - name: Create archives
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          cd dist
          for dir in hubcap-*; do
            if [[ "$dir" == *windows* ]]; then
              zip "${dir}.zip" -r "$dir"
            else
              tar czf "${dir}.tar.gz" "$dir"
            fi
          done
          sha256sum *.tar.gz *.zip > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.NOTES }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      - name: Generate Homebrew tap token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.HOMEBREW_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: tomyan
          repositories: homebrew-tap

      - name: Update Homebrew tap
        if: steps.app-token.outcome == 'success'
        env:
          TAP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}

          darwin_arm64=$(grep "darwin-arm64.tar.gz" dist/checksums.txt | awk '{print $1}')
          darwin_amd64=$(grep "darwin-amd64.tar.gz" dist/checksums.txt | awk '{print $1}')
          linux_arm64=$(grep "linux-arm64.tar.gz" dist/checksums.txt | awk '{print $1}')
          linux_amd64=$(grep "linux-amd64.tar.gz" dist/checksums.txt | awk '{print $1}')

          cat > /tmp/hubcap.rb <<FORMULA
          class Hubcap < Formula
            desc "CLI for Chrome DevTools Protocol"
            homepage "https://github.com/tomyan/hubcap"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/tomyan/hubcap/releases/download/v${VERSION}/hubcap-v${VERSION}-darwin-arm64.tar.gz"
                sha256 "${darwin_arm64}"
              else
                url "https://github.com/tomyan/hubcap/releases/download/v${VERSION}/hubcap-v${VERSION}-darwin-amd64.tar.gz"
                sha256 "${darwin_amd64}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/tomyan/hubcap/releases/download/v${VERSION}/hubcap-v${VERSION}-linux-arm64.tar.gz"
                sha256 "${linux_arm64}"
              else
                url "https://github.com/tomyan/hubcap/releases/download/v${VERSION}/hubcap-v${VERSION}-linux-amd64.tar.gz"
                sha256 "${linux_amd64}"
              end
            end

            def install
              bin.install "hubcap"
            end

            test do
              assert_match "unknown command", shell_output("#{bin}/hubcap notacommand 2>&1", 1)
            end
          end
          FORMULA

          # Remove leading whitespace from heredoc indentation
          sed -i 's/^          //' /tmp/hubcap.rb

          git config --global credential.helper store
          echo "https://x-access-token:${TAP_TOKEN}@github.com" > ~/.git-credentials
          git clone "https://github.com/tomyan/homebrew-tap.git" /tmp/homebrew-tap
          cp /tmp/hubcap.rb /tmp/homebrew-tap/Formula/hubcap.rb
          cd /tmp/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/hubcap.rb
          git commit -m "hubcap ${VERSION}"
          git push
